[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dispute-agent"
version = "0.1.0"
description = "An AI agent that investigates Amazon vendor deductions and drafts disputes, with deterministic guardrails and evals against known answers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ney Fred Jiménez Campos" }]
dependencies = [
  "vendor-recovery-engine @ git+https://github.com/jmnzcn/vendor-recovery-engine",
  "pandas>=2.2",
  "pyarrow>=15",
  "rapidfuzz>=3.6",
  "httpx>=0.27",
  "mcp>=2.3,<3",
  "typer>=0.12",
]

[project.optional-dependencies]
claude = ["anthropic>=2.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
dispute-agent = "dispute_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer.Option defaults are the typer idiom
